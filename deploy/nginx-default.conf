server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Required for wasm threads / SharedArrayBuffer (telepathy_core_bg.wasm)
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # wasm must be served with the right MIME type; long-cache hashed assets
    location /pkg/ {
        types { application/wasm wasm; }
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /assets/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # never cache entrypoints
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.js { add_header Cache-Control "no-cache"; }
}
